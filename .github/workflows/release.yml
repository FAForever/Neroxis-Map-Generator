# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Generator Jar Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Generator Version'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: 21
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create Jar
        run: ./gradlew --stacktrace build shadowJar --no-daemon -PgeneratorVersion="${{ github.event.inputs.version }}"

      - name: Archive shadow jar artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generator-shadow-jar
          path: ./**/NeroxisGen_*.jar

  package:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macOS-latest, windows-latest ]
      fail-fast: false
    name: Package ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: 21
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Package with Gradle
        run: ./gradlew -x test --stacktrace jpackage --no-daemon -PgeneratorVersion="${{ github.event.inputs.version }}"

      - name: Archive jpackage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jpackage-${{ matrix.os }}
          path: ./**/jpackage
  
  release:
    runs-on: ubuntu-latest
    needs:
      - package
      - build
    steps:
      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v4

      - name: Zip and tar packages
        run: |
          zip -r jpackage-windows-latest/generator/build/jpackage/neroxis-generator-windows-${{ github.event.inputs.version }}.zip jpackage-windows-latest/generator/build/jpackage/neroxis-generator
          zip -r jpackage-windows-latest/toolsuite/build/jpackage/neroxis-toolsuite-windows-${{ github.event.inputs.version }}.zip jpackage-windows-latest/toolsuite/build/jpackage/neroxis-toolsuite
          tar czf jpackage-ubuntu-latest/generator/build/jpackage/neroxis-generator-linux-${{ github.event.inputs.version }}.tar.gz jpackage-ubuntu-latest/generator/build/jpackage/neroxis-generator
          tar czf jpackage-ubuntu-latest/toolsuite/build/jpackage/neroxis-toolsuite-linux-${{ github.event.inputs.version }}.tar.gz jpackage-ubuntu-latest/toolsuite/build/jpackage/neroxis-toolsuite
          tar czf jpackage-macOS-latest/generator/build/jpackage/neroxis-generator-macos-${{ github.event.inputs.version }}.tar.gz jpackage-macOS-latest/generator/build/jpackage/neroxis-generator
          tar czf jpackage-macOS-latest/toolsuite/build/jpackage/neroxis-toolsuite-macos-${{ github.event.inputs.version }}.tar.gz jpackage-macOS-latest/toolsuite/build/jpackage/neroxis-toolsuite

      - name: Create Draft Release
        uses: ncipollo/release-action@v1
        with:
          commit: ${{ github.sha }}
          draft: true
          preserve_order: true
          tag: ${{ github.event.inputs.version }}
          release_name: NeroxisGen_${{ github.event.inputs.version }}
          generateReleaseNotes: true
          artifacts: >
            generator-shadow-jar/**/*.jar,
            jpackage-windows-latest/**/*.exe,
            jpackage-windows-latest/**/*.msi,
            jpackage-windows-latest/**/*.zip,
            jpackage-ubuntu-latest/**/*.deb,
            jpackage-ubuntu-latest/**/*.rpm,
            jpackage-ubuntu-latest/**/*.tar.gz,
            jpackage-macOS-latest/**/*.dmg,
            jpackage-macOS-latest/**/*.pkg,
            jpackage-macOS-latest/**/*.tar.gz
