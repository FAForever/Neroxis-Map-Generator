# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Generator Jar Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Generator Version'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 25
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: 25
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Checks
        run: ./gradlew --stacktrace check --parallel

      - name: Create Jar
        run: ./gradlew --stacktrace shadowJar --parallel -PgeneratorVersion="${{ github.event.inputs.version }}"

      - name: Archive shadow jar artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generator-shadow-jar
          path: ./**/NeroxisGen_*.jar

  package:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macOS-latest, windows-latest ]
      fail-fast: false
    name: Package ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 25
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Package with Gradle
        run: |
          echo $JAVA_HOME
          ./gradlew -x test --stacktrace jlink --parallel -PgeneratorVersion="${{ github.event.inputs.version }}"
          ./generator/build/image/bin/java -XX:AOTCacheOutput=generator/build/image/bin/neroxis-generator.aot -XX:+UseCompactObjectHeaders -m com.faforever.neroxis.generator/com.faforever.neroxis.generator.MapGenerator --out-path ./GeneratedMaps                                                                                                                                                                                                                       
          ./gradlew -x test --stacktrace jpackage --parallel -PgeneratorVersion="${{ github.event.inputs.version }}"

      - name: Archive jpackage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jpackage-${{ matrix.os }}
          path: ./**/jpackage
  
  release:
    runs-on: ubuntu-latest
    needs:
      - package
      - build
    steps:
      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v4

      - name: Zip and tar packages
        run: |
          (cd jpackage-windows-latest/generator/build/jpackage/neroxis-generator && zip -r ../neroxis-generator-windows-${{ github.event.inputs.version }}.zip *)
          (cd jpackage-windows-latest/toolsuite/build/jpackage/neroxis-toolsuite && zip -r ../neroxis-toolsuite-windows-${{ github.event.inputs.version }}.zip *)
          (cd jpackage-ubuntu-latest/generator/build/jpackage/neroxis-generator && tar czf ../neroxis-generator-linux-${{ github.event.inputs.version }}.tar.gz *)
          (cd jpackage-ubuntu-latest/toolsuite/build/jpackage/neroxis-toolsuite && tar czf ../neroxis-toolsuite-linux-${{ github.event.inputs.version }}.tar.gz *)
          (cd jpackage-macOS-latest/generator/build/jpackage/neroxis-generator.app && tar czf ../neroxis-generator-macos-${{ github.event.inputs.version }}.tar.gz *)
          (cd jpackage-macOS-latest/toolsuite/build/jpackage/neroxis-toolsuite.app && tar czf ../neroxis-toolsuite-macos-${{ github.event.inputs.version }}.tar.gz *)

      - name: Create Draft Release
        uses: ncipollo/release-action@v1
        with:
          commit: ${{ github.sha }}
          draft: true
          tag: ${{ github.event.inputs.version }}
          generateReleaseNotes: true
          artifacts: >
            generator-shadow-jar/**/*.jar,
            jpackage-windows-latest/**/build/jpackage/*.exe,
            jpackage-windows-latest/**/build/jpackage/*.msi,
            jpackage-windows-latest/**/build/jpackage/*.zip,
            jpackage-ubuntu-latest/**/build/jpackage/*.deb,
            jpackage-ubuntu-latest/**/build/jpackage/*.rpm,
            jpackage-ubuntu-latest/**/build/jpackage/*.tar.gz,
            jpackage-macOS-latest/**/build/jpackage/*.dmg,
            jpackage-macOS-latest/**/build/jpackage/*.pkg,
            jpackage-macOS-latest/**/build/jpackage/*.tar.gz
